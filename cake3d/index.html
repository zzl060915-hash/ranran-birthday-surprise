        <div class="input-container">
            <h2><i class="fas fa-cake-candles"></i> 输入你的名字 <i class="fas fa-cake-candles"></i></h2>
            <p class="main-instruction">为这只生日蛋糕加上一份专属祝福。</p>

        <h2>一起庆祝吧 <i class="fas fa-confetti"></i></h2>

            点击任意位置<br>看见蛋糕并开始播放
    </p>

    <div id="hold-reminder">
        <h2><i class="fas fa-wand-magic-sparkles"></i> 许个心愿吧 <i class="fas fa-wand-magic-sparkles"></i></h2>
        <p class="main-instruction"><i class="fas fa-fire-flame-curved"></i> 对着麦克风吹气，或者长按屏幕</p>
        <p class="sub-instruction"><i class="fas fa-seedling"></i> 把这一刻留给最想实现的愿望</p>
    </div>
    
    <!-- تایمر معکوس با قابلیت تغییر متن -->
    <div class="song-countdown" id="song-countdown">
        <div class="countdown-number" id="countdown-number">38</div>
        <div class="countdown-label" id="countdown-label">
            <span>生日歌</span>
            <small>秒后吹蜡烛</small>
        </div>
    </div>
    
    <div id="congratulation-overlay">
        <div id="congratulation-text">
            <h3><i class="fas fa-gift"></i> 生日快乐 <i class="fas fa-gift"></i></h3>
            <!-- Personalized name will appear here -->
            <h4 id="personalized-name"></h4>
            <button id="cake-next-button" type="button">收下这份祝福 <span aria-hidden="true">→</span></button>
        </div>
    </div>

    <!-- کانواس جدید برای افکت کنفتی -->
    <canvas id="confetti-canvas"></canvas>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const isEmbedded = params.get("embedded") === "1";
        const queryName = (params.get("name") || "").replace(/[<>]/g, "").trim().slice(0, 20);
        let savedName = "";
        try {
            savedName = (localStorage.getItem("birthdayUserName") || "").trim().slice(0, 20);
        } catch (error) {
            savedName = "";
        }

        // Store user name globally
        let userName = queryName || savedName;
        
        // Name input functionality
        const nameInputScreen = document.getElementById('name-input-screen');
        const userNameInput = document.getElementById('user-name-input');
        const startCelebrationBtn = document.getElementById('start-celebration-btn');
        const volumeReminder = document.getElementById('volume-reminder');
        const audio = document.getElementById('happy-birthday-audio');
        const personalizedNameElement = document.getElementById('personalized-name');
        const cakeNextButton = document.getElementById('cake-next-button');
        
        // متغیرهای تایمر معکوس اضافه شده
        const songCountdown = document.getElementById('song-countdown');
        const countdownNumber = document.getElementById('countdown-number');
        const countdownLabel = document.getElementById('countdown-label'); // برای تغییر متن
        let songCountdownValue = 38;
        let songCountdownInterval;
        
        // تابع شروع تایمر معکوس (به‌روزرسانی شده)
        function startSongCountdown() {
            songCountdownValue = Math.max(1, Math.ceil(Number.isFinite(audio.duration) ? audio.duration : 38));
            countdownNumber.textContent = songCountdownValue;
            countdownLabel.innerHTML = `<span>生日歌</span><small>秒后吹蜡烛</small>`;
            songCountdown.style.display = 'flex';
            
            songCountdownInterval = setInterval(() => {
                songCountdownValue--;
                countdownNumber.textContent = songCountdownValue;
                
                if (songCountdownValue <= 0) {
                    clearInterval(songCountdownInterval);
                    // وقتی آهنگ تموم شد → نمایش "Wait..."
                    countdownNumber.textContent = '★';
                    countdownLabel.innerHTML = `
                        <span style="font-size: 1.1em; font-weight: bold;">准备好了吗</span>
                        <small>把愿望留在心里</small>
                    `;
                }
            }, 1000);
        }

        function setPersonalizedName(name) {
            if (personalizedNameElement) {
                personalizedNameElement.textContent = name + "！🎈";
            }
        }

        function showVolumeReminder() {
            volumeReminder.style.display = 'flex';
            window.setTimeout(function () {
                volumeReminder.classList.add('show');
            }, 50);
        }

        // Start celebration when button is clicked
        startCelebrationBtn.addEventListener("click", function () {
            userName = userNameInput.value.trim();
            
            // If no name entered, use default
            if (!userName) {
                userName = "Friend";
            }
            
            // Store the name for later use
            try {
                localStorage.setItem('birthdayUserName', userName);
            } catch (error) {
                // Direct file:// access can disable local storage.
            }
            
            // تنظیم نام در المان نمایش
            setPersonalizedName(userName);
            
            // Hide name input screen
            nameInputScreen.classList.remove('show');
            setTimeout(function () {
                nameInputScreen.style.display = 'none';
            }, 1000);
            
            // Show volume reminder
            showVolumeReminder();
        });
        
        // Allow pressing Enter to start
        userNameInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                startCelebrationBtn.click();
            }
        });
        
        if (userName) {
            userNameInput.value = userName;
            setPersonalizedName(userName);
        }

        if (isEmbedded) {
            nameInputScreen.classList.remove('show');
            nameInputScreen.style.display = 'none';
            showVolumeReminder();
        }
        
        // Original volume reminder functionality
        volumeReminder.addEventListener("click", function () {
            const playRequest = audio.play();
            if (playRequest && typeof playRequest.catch === "function") {
                playRequest.catch(function () {
                    // Some browsers require a direct user gesture before audio can start.
                });
            }
            volumeReminder.classList.remove('show');
            setTimeout(function () {
                volumeReminder.style.display = 'none';
            }, 1000);
            
            // شروع تایمر معکوس وقتی آهنگ پخش می‌شود
            startSongCountdown();

            // فعال‌سازی افکت کنفتی جدید
            startConfetti();
        });
        
        // پاک کردن interval هنگام بسته شدن صفحه
        window.addEventListener('beforeunload', function() {
            if (songCountdownInterval) clearInterval(songCountdownInterval);
        });

        // ================== ویژگی جدید: تشخیص نمایش hold-reminder و تغییر متن به "Blow!" ==================
        const holdReminder = document.getElementById('hold-reminder');
        const observer = new MutationObserver(() => {
            if (holdReminder.style.display === 'flex' || holdReminder.style.display === 'block' || 
                window.getComputedStyle(holdReminder).display !== 'none') {
                
                songCountdown.style.display = 'flex'; // دوباره نمایش بده اگر مخفی شده بود
                countdownNumber.textContent = '🎤';
                countdownLabel.innerHTML = `
                    <span style="font-size: 1.3em; font-weight: bold; letter-spacing: 1px;">吹气</span>
                    <small>对着麦克风</small>
                `;
            }
        });

        observer.observe(holdReminder, {
            attributes: true,
            attributeFilter: ['style', 'class']
        });

        // همچنین چک اولیه در صورت لود شدن صفحه با حالت فعال
        if (window.getComputedStyle(holdReminder).display !== 'none') {
            countdownNumber.textContent = '🎤';
            countdownLabel.innerHTML = `<span style="font-size: 1.3em; font-weight: bold;">吹气</span><small>对着麦克风</small>`;
            songCountdown.style.display = 'flex';
        }
        // =================================================================================================

        // ================== ویژگی جدید: افکت کنفتی ==================
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimation;

        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        });

        function randomColor() {
            const colors = ['#ff3366', '#ff9933', '#ffd700', '#ff69b4', '#00ffcc', '#ff4500', '#9400d3', '#00bfff'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createConfetti() {
            return {
                x: Math.random() * confettiCanvas.width,
                y: -10,
                size: Math.random() * 8 + 5,
                speedY: Math.random() * 3 + 2,
                speedX: Math.random() * 3 - 1.5,
                rotation: Math.random() * 360,
                rotationSpeed: Math.random() * 10 - 5,
                color: randomColor(),
                opacity: 1
            };
        }

        function startConfetti() {
            // پاک کردن کنفتی قبلی اگر وجود داشت
            cancelAnimationFrame(confettiAnimation);
            confettiParticles = [];

            function animate() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

                // ایجاد ذرات جدید
                if (Math.random() > 0.3) {
                    confettiParticles.push(createConfetti());
                }

                confettiParticles.forEach((p, i) => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotationSpeed;
                    p.opacity = 1 - (p.y / confettiCanvas.height);

                    if (p.y > confettiCanvas.height || p.opacity <= 0) {
                        confettiParticles.splice(i, 1);
                    }

                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
                    ctx.restore();
                });

                if (confettiParticles.length > 0 || audio.currentTime < audio.duration - 1) {
                    confettiAnimation = requestAnimationFrame(animate);
                }
            }

            animate();

            // توقف خودکار کنفتی بعد از پایان آهنگ
            audio.addEventListener('ended', () => {
                setTimeout(() => {
                    confettiParticles = [];
                    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                }, 2000);
            });
        }
        // ============================================================

        cakeNextButton.addEventListener('click', function () {
            if (isEmbedded && window.parent !== window) {
                const parentOrigin = /^https?:$/.test(window.location.protocol)
                    ? window.location.origin
                    : '*';
                window.parent.postMessage({
                    type: 'birthday-cake:complete',
                    name: userName
                }, parentOrigin);
                return;
            }

            const nextUrl = new URL('../html/Memories.html', window.location.href);
            nextUrl.searchParams.set('name', userName || '小寿星');
            window.location.href = nextUrl.href;
        });
    </script>
    <script>
(async function () {
  const names = ["cake-script-01.b64","cake-script-02.b64","cake-script-03.b64","cake-script-04.b64","cake-script-05.b64"];
  const parts = await Promise.all(names.map(function (name) {
    return fetch('../assets/' + name, { cache: 'force-cache' }).then(function (response) {
      if (!response.ok) throw new Error('Cake asset failed: ' + response.status);
      return response.text();
    });
  }));
  const binary = atob(parts.join('').replace(/\s+/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) {
    bytes[index] = binary.charCodeAt(index);
  }
  const script = document.createElement('script');
  script.src = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
  document.body.appendChild(script);
})().catch(function (error) { console.error(error); });
</script>
