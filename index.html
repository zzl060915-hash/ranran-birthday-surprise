<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#efadbd">
  <meta name="description" content="一份送给王思然的生日祝福。">
  <meta property="og:title" content="然然的生日小惊喜">
  <meta property="og:description" content="输入属于今天的四位密码，打开这份生日祝福。">
  <meta property="og:type" content="website">
  <title>然然的生日小惊喜</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #fff8fa 0, #fce8ed 52%, #efadbd 100%);
      color: #692b3b;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    main { padding: 32px; text-align: center; }
    .heart {
      display: inline-grid;
      width: 74px;
      height: 74px;
      margin-bottom: 18px;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(145deg, #d95978, #a93456);
      box-shadow: 0 20px 46px rgba(113, 45, 62, .22);
      color: #fff8fa;
      font-size: 34px;
      animation: beat 1.8s ease-in-out infinite;
    }
    h1 { margin: 0 0 10px; font-family: serif; font-size: clamp(23px, 5vw, 34px); }
    p { margin: 0; color: #8e4a5d; line-height: 1.8; }
    .progress { width: min(240px, 70vw); height: 5px; margin: 24px auto 0; overflow: hidden; border-radius: 99px; background: #f2c5d1; }
    .progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #bf3e60; animation: load 1.4s ease-in-out infinite alternate; }
    .error { display: none; color: #9d2948; }
    @keyframes beat { 50% { transform: scale(1.08); } }
    @keyframes load { to { transform: translateX(138%); } }
  </style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">♥</div>
    <h1>然然的生日小惊喜</h1>
    <p class="status">正在打开属于你的生日惊喜…</p>
    <p class="error">页面没有完整加载，请刷新后再试。</p>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
  <script>
    (async function () {
      const names = ["payload-01.b64","payload-02.b64","payload-03.b64","payload-04.b64","payload-05.b64","payload-06.b64","payload-07.b64","payload-08.b64","payload-09.b64","payload-10.b64","payload-11.b64","payload-12.b64","payload-13.b64"];
      try {
        const encoded = (await Promise.all(names.map(function (name) {
          return fetch('parts/' + name, { cache: 'force-cache' }).then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
          });
        }))).join('');
        const binary = atob(encoded.replace(/\s+/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        const html = new TextDecoder('utf-8').decode(bytes);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.querySelector('.status').textContent = '暂时没能打开这份惊喜';
        document.querySelector('.error').style.display = 'block';
        document.querySelector('.progress').style.display = 'none';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
